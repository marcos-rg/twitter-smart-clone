name: twitter-smart-clone

# Base local-development stack (TSC-FOUND-002): API, worker, frontend,
# PostgreSQL 16, Redis 7, and MinIO. All non-secret defaults below allow
# `docker compose config` / `docker compose up` to work on a clean checkout
# with no `.env` file; copy .env.example to .env to override them locally.
#
# Use `docker-compose.dev.yml` on top of this file (see the Makefile `up`
# target) to bind-mount source code for hot reload. Production hardening
# (docker-compose.prod.yml, non-dev images, TLS, etc.) is deferred to
# TSC-OPS-001.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twitter_smart_clone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twitter_smart_clone_dev}
      POSTGRES_DB: ${POSTGRES_DB:-twitter_smart_clone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-twitter_smart_clone} -d ${POSTGRES_DB:-twitter_smart_clone}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-dev-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: creates the media bucket on a fresh volume, then exits.
  # Not part of the "stack is up" health signal — only `minio` itself is.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-twitter-smart-clone-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: twitter-smart-clone/backend:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://twitter_smart_clone:twitter_smart_clone_dev@postgres:5432/twitter_smart_clone}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-twitter-smart-clone-media}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Celery worker/beat wiring lands in TSC-CORE-001. The service is defined
  # now so the compose topology matches specification.md §12.1, but it only
  # runs a placeholder command until a Celery app exists to point at.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    image: twitter-smart-clone/backend:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://twitter_smart_clone:twitter_smart_clone_dev@postgres:5432/twitter_smart_clone}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-twitter-smart-clone-media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "echo 'worker placeholder: Celery app lands in TSC-CORE-001' && sleep infinity",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: twitter-smart-clone/frontend:dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  minio_data:
