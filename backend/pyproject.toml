[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.4",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

# Ratcheting coverage gate (TSC-FOUND-003): raised as features land so the
# final 80% line-coverage gate in TSC-QA-001 is not a last-minute cliff.
# CI fails the backend job if coverage drops below this threshold; bump it
# upward whenever a feature task lands with well-tested code.
[tool.coverage.report]
fail_under = 60
show_missing = true
