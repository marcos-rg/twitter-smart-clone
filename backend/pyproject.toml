[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.39",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.4",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true

# Neither package ships inline types or a third-party stub package (aioboto3
# unofficially delegates to aiobotocore/botocore internals; celery is stubless
# upstream). Everywhere they're imported, values crossing the boundary are
# explicitly typed/narrowed on our side instead of trusted from these libs.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

# Ratcheting coverage gate (TSC-FOUND-003): raised as features land so the
# final 80% line-coverage gate in TSC-QA-001 is not a last-minute cliff.
# CI fails the backend job if coverage drops below this threshold; bump it
# upward whenever a feature task lands with well-tested code.
[tool.coverage.report]
fail_under = 80
show_missing = true
